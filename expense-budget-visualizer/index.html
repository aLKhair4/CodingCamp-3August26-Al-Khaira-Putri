<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense & Budget Visualizer</title>

    <!-- Prevent flash of unstyled content: apply stored theme before CSS renders -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ebv_theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {
          // localStorage unavailable — default light theme stays
        }
      })();
    </script>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Application styles -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Expense &amp; Budget Visualizer</h1>
      <button id="theme-toggle" type="button" aria-label="Toggle dark/light mode">
        Toggle Theme
      </button>
    </header>

    <main class="dashboard"> 

      <!-- Balance Display -->
      <section id="balance-section" aria-label="Total balance">
        <h2>Total Balance</h2>
        <div id="balance-display">$0.00</div>
      </section>

      <!-- Spending Chart -->
      <section id="chart-section" aria-label="Spending chart">
        <h2>Spending by Category</h2>
        <canvas id="spending-chart" role="img" aria-label="Pie chart of spending by category"></canvas>
        <p id="chart-empty-message" hidden>No spending data to visualise.</p>
      </section>

      <!-- Transaction &amp; Category Forms -->
      <section id="form-section" aria-label="Add transaction and category">

        <!-- Transaction Input Form -->
        <form id="transaction-form" novalidate>
          <h2>Add Transaction</h2>

          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              id="item-name"
              type="text"
              maxlength="100"
              placeholder="e.g. Coffee"
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="amount">Amount</label>
            <input
              id="amount"
              type="number"
              step="0.01"
              min="0.01"
              placeholder="0.00"
            />
          </div>

          <div class="form-group">
            <label for="category-select">Category</label>
            <select id="category-select">
              <option value="">-- Select a category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>

          <button type="submit">Add Transaction</button>
        </form>

        <!-- Custom Category Form -->
        <form id="category-form" novalidate>
          <h2>Add Custom Category</h2>

          <div class="form-group">
            <label for="custom-category-name">Category Name</label>
            <input
              id="custom-category-name"
              type="text"
              maxlength="50"
              placeholder="e.g. Healthcare"
              autocomplete="off"
            />
          </div>

          <button type="submit">Add Category</button>
        </form>

      </section>

      <!-- Sort Control -->
      <section id="sort-section" aria-label="Sort transactions">
        <label for="sort-control">Sort by</label>
        <select id="sort-control">
          <option value="date-desc" selected>Date: Newest First</option>
          <option value="amount-asc">Amount: Low to High</option>
          <option value="amount-desc">Amount: High to Low</option>
          <option value="category-asc">Category: A–Z</option>
          <option value="category-desc">Category: Z–A</option>
        </select>
      </section>

      <!-- Transaction List -->
      <section id="list-section" aria-label="Transaction list">
        <h2>Transactions</h2>
        <ul id="transaction-list" aria-live="polite" aria-label="List of recorded transactions">
          <!-- Transaction <li> elements are rendered here by app.js -->
        </ul>
      </section>

    </main>

    <!-- Application logic -->
    <script defer src="js/app.js"></script>
  </body>
</html>
